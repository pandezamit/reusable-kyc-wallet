apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: kyc-demo
data:
  CANTON_LEDGER_HOST: "canton"   # override or omit if backend runs without a ledger
  CANTON_LEDGER_PORT: "5011"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: kyc-demo
  labels:
    app: backend
spec:
  replicas: 1
  strategy:
    type: Recreate   # H2 in-memory DB: keep it to a single pod
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: asia-south1-docker.pkg.dev/ltc-hack2026-team15/kyc-repo/backend:latest   # <-- replace after pushing your image
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
          envFrom:
            - configMapRef:
                name: backend-config
                optional: true   # deployment still starts fine if this ConfigMap is absent
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: kyc-demo
  labels:
    app: backend
spec:
  type: LoadBalancer   # GCP provisions an external Network Load Balancer with a public IP
  selector:
    app: backend
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: backend-managed-cert
  namespace: kyc-demo
spec:
  domains:
    - kyc-demo.example.com   # <-- replace with your actual domain
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend-ingress
  namespace: kyc-demo
  annotations:
    networking.gke.io/managed-certificates: "backend-managed-cert"
    kubernetes.io/ingress.class: "gce"
spec:
  rules:
    - host: kyc-demo.example.com   # <-- replace with your actual domain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 80