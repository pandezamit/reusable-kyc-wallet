version: '3.8'
services:
  postgres:
    image: postgres:14-alpine
    environment:
      POSTGRES_DB: kycdb
      POSTGRES_USER: kycuser
      POSTGRES_PASSWORD: kycpass
    ports: ["5432:5432"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]

  canton-participant:
    image: digitalasset/canton:latest
    command: daemon --config /canton/canton.conf
    volumes: ["./canton:/canton"]
    ports: ["6865:6865"]
